# Render Blueprint. Free web service in Singapore, next to Neon aws-ap-southeast-1.
# Node version comes from .node-version (22.x; Render's own default would be 24).
# Secrets use sync: false, so Render asks for them in the dashboard. They are never stored here.
# Web Push (VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY / VAPID_SUBJECT) is optional: add all three
# later in the dashboard to switch it on (see docs/deploy.md).
services:
  - type: web
    name: akshaya-home-care
    runtime: node
    plan: free
    region: singapore
    # --include=dev because the Vite build needs devDependencies while NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Render terminates TLS at its proxy; the client IP arrives in X-Forwarded-For.
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: PIN_PEPPER
        sync: false
